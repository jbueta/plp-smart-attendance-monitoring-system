<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Prevent browser caching to ensure changes are visible immediately -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <title>{% block title %}PLP Smart System{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <!-- Overlay for background dimming -->
    <div class="vignette-overlay"></div>

    <!-- Global Status Card (Success / Fail Toast) -->
    <div id="global-status-card" class="position-fixed top-0 start-50 translate-middle-x mt-4 p-3 rounded-4 shadow-lg d-flex align-items-center" style="z-index: 9999; min-width: 320px; opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease; transform: translateY(-20px);">
        <div id="gsc-icon" class="fs-2 me-3"></div>
        <div>
            <h6 id="gsc-title" class="mb-1 fw-bold text-white"></h6>
            <p id="gsc-message" class="mb-0 small text-white-50"></p>
        </div>
    </div>

    <!-- Global Confirm Modal (Deletion/Action Confirm) -->
    <div id="global-confirm-modal" class="position-fixed top-0 start-0 w-100 h-100 d-none align-items-center justify-content-center" style="z-index: 10000; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px);">
        <div class="card-glass p-4 text-center shadow-lg" style="min-width: 350px; max-width: 400px; border-top: 4px solid #dc3545;">
            <div class="mb-3">
                <i class="bi bi-exclamation-triangle-fill text-danger display-4"></i>
            </div>
            <h5 id="gcm-title" class="fw-bold text-white mb-2">Confirm Deletion</h5>
            <p id="gcm-message" class="text-white-50 small mb-4">Are you sure you want to delete this item? This action cannot be undone.</p>
            <div class="d-flex justify-content-center gap-3">
                <button type="button" class="btn btn-outline-light px-4" onclick="hideConfirmModal()">Cancel</button>
                <button type="button" id="gcm-confirm-btn" class="btn btn-danger px-4">Delete</button>
            </div>
        </div>
    </div>

    <!-- Main Content Block - To be overridden by child templates -->
    {% block content %}{% endblock %}

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block extra_js %}{% endblock %}
    <!-- Custom Simulation -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
