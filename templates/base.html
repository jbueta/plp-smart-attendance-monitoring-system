<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PLP Smart System{% endblock %}</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <!-- Custom Theme -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}">
    <!-- Overlay for background dimming -->
    <div class="vignette-overlay"></div>

    <!-- Main Content Block - To be overridden by child templates -->
    {% block content %}{% endblock %}

    <div id="instance-generator-toast" class="instance-generator-toast d-none" role="status" aria-live="polite">
        <div class="instance-generator-toast__icon">
            <div class="spinner-border spinner-border-sm text-gold" id="instance-generator-spinner" aria-hidden="true"></div>
            <i class="bi bi-check-circle-fill text-success d-none" id="instance-generator-success"></i>
            <i class="bi bi-exclamation-triangle-fill text-danger d-none" id="instance-generator-error"></i>
        </div>
        <div class="instance-generator-toast__body">
            <div class="instance-generator-toast__title" id="instance-generator-title">Preparing event instances</div>
            <div class="instance-generator-toast__message" id="instance-generator-message">Checking scheduler status...</div>
        </div>
    </div>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Main Custom JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    <script>
        window.APP_CONFIG = {{ {"backendApiUrl": backend_api_url}|tojson }};
    </script>

    {% block extra_js %}{% endblock %}
    <!-- Custom Simulation -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</body>

</html>
