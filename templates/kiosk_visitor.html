<!-- Load base layout -->
{% extends "base.html" %}

<!-- Page title -->
{% block title %}Visitor Portal - PLP{% endblock %}

<!-- Page content -->
{% block content %}
<div class="container py-5 min-vh-100 d-flex flex-column justify-content-center">

    <!-- Header -->
    <div class="text-center mb-5">
        <h1 class="display-4 fw-bold text-white mb-2">Visitor Portal</h1>
        <p class="lead text-white-50">Please register your entry or exit below.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card-glass p-0 overflow-hidden">
                <!-- Single Tab -->
                <ul class="nav nav-pills nav-fill bg-dark bg-opacity-50" id="visitorTabs" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link active rounded-0 py-3 fw-bold text-uppercase" id="checkin-tab"
                            data-bs-toggle="tab" data-bs-target="#checkin" type="button" role="tab"
                            style="cursor: default;">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Visitor Check In
                        </button>
                    </li>
                </ul>

                <div class="tab-content p-4" id="visitorTabsContent">
                    <!-- Check In Form -->
                    <div class="tab-pane fade show active" id="checkin" role="tabpanel">
                        <form action="{{ url_for('visitor_checkin') }}" method="POST">
                            <input type="hidden" name="source" value="kiosk_visitor">
                            <div class="mb-3">
                                <label class="form-label text-white-50">Full Name <span
                                        class="text-danger">*</span></label>
                                <input type="text" name="name" class="form-control bg-dark text-white border-secondary"
                                    required placeholder="e.g. Juan dela Cruz">
                            </div>
                            <div class="mb-3">
                                <label class="form-label text-white-50">Purpose of Visit <span
                                        class="text-danger">*</span></label>
                                <select name="purpose" class="form-select bg-dark text-white border-secondary visitor-purpose-select" required>
                                    <option value="" selected disabled>Select Purpose</option>
                                    <option>Official Business</option>
                                    <option>Document Submission</option>
                                    <option>Inquiry</option>
                                    <option>Meeting</option>
                                    <option>Delivery</option>
                                    <option>Other</option>
                                </select>
                            </div>
                            <div class="mb-3 d-none visitor-details-group">
                                <label class="form-label text-white-50">Specify Purpose <span class="text-danger">*</span></label>
                                <input type="text" name="details" class="form-control bg-dark text-white border-secondary visitor-details-input"
                                    placeholder="Enter the custom purpose">
                            </div>
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary-gold p-3 fw-bold text-uppercase">
                                    Confirm Check In
                                </button>
                            </div>
                        </form>
                    </div>

                    <!-- Check Out List removed as requested -->
                </div>
            </div>
        </div>
    </div>

    <!-- Back Button -->
    <div class="text-center mt-5">
        <a href="{{ url_for('index') }}" class="btn btn-outline-light rounded-pill px-4">
            <i class="bi bi-arrow-left me-2"></i>Back to Main Menu
        </a>
    </div>

</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('form').forEach(form => {
            const purposeSelect = form.querySelector('.visitor-purpose-select');
            const detailsGroup = form.querySelector('.visitor-details-group');
            const detailsInput = form.querySelector('.visitor-details-input');

            if (!purposeSelect || !detailsGroup || !detailsInput) return;

            const syncVisitorDetails = () => {
                const isOther = (purposeSelect.value || '').trim().toLowerCase() === 'other';
                detailsGroup.classList.toggle('d-none', !isOther);
                detailsInput.required = isOther;
                if (!isOther) {
                    detailsInput.value = '';
                }
            };

            purposeSelect.addEventListener('change', syncVisitorDetails);
            syncVisitorDetails();
        });
    });
</script>
{% endblock %}
